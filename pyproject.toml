[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlabel"
version = "0.23.0"
description = "TouchLabel AI - Tactile Data Annotation Toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Niuzu Tech", email = "luoxi@touchlabelai.cn"},
]
keywords = ["tactile", "annotation", "robotics", "GelSight", "PaXini", "touch", "FTP-1", "MTTS", "MTTS-1", "panel", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
gelsight = ["opencv-python>=4.0"]
paxini = ["h5py>=3.0"]
daimon = ["pyarrow>=10.0", "opencv-python>=4.0", "scipy>=1.7"]
ftp1 = ["zarr>=2.16"]
ml = ["scikit-learn>=1.0", "joblib>=1.0"]
all = ["opencv-python>=4.0", "h5py>=3.0", "pyarrow>=10.0", "scipy>=1.7", "pillow>=9.0", "scikit-learn>=1.0", "joblib>=1.0", "zarr>=2.16"]
dev = ["pytest", "jupyter", "pyarrow", "zarr", "scikit-learn>=1.0"]

[project.scripts]
tlabel = "tlabel.cli:main"

[project.urls]
Homepage = "https://github.com/liesliy/tlabel"
"Bug Reports" = "https://github.com/liesliy/tlabel/issues"
"Discussions" = "https://github.com/liesliy/tlabel/discussions"
"User Survey" = "https://github.com/liesliy/tlabel/blob/main/USER_SURVEY.md"

[tool.setuptools.packages.find]
include = ["tlabel*"]

[tool.setuptools.package-data]
tlabel = ["demo_data/*.json"]

